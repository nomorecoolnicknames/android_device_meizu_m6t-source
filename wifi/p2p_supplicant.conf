##### p2p_supplicant configuration - Meizu M6T (M6T / M811H) #####
#
# Minimal MediaTek-combo template. INFERENCE from M6: same SoC, and 721 of 744
# M6 blob entries matched the M6T dump byte-for-name (M6T_DUMP_ANALYSIS §7).
# Nothing here has been exercised on M6T hardware - there is none.
#
# The AOSP wpa_supplicant module in A13 no longer ships a wpa_supplicant.conf
# module of its own, so the device tree has to provide the file.
update_config=1
ctrl_interface=/data/vendor/wifi/wpa/sockets
driver_param=use_p2p_group_interface=1

device_name=Meizu M6T
manufacturer=Meizu
model_name=M6T
model_number=M811H
serial_number=
device_type=10-0050F204-5
config_methods=physical_display virtual_push_button
p2p_no_group_iface=1
